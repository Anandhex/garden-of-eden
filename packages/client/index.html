<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Realm</title>
<link rel="stylesheet" href="/src/style.css">
</head>
<body>
<header>
  <h1 id="site-name" title="Where you are">…</h1>
  <span id="time" class="pill">…</span>
  <span id="today" class="pill" title="Weather, season and what's on in town">…</span>
  <span id="hpbar" class="pill">HP</span>
  <span id="mpbar" class="pill">MP</span>
  <span id="gold" class="pill">0 copper</span>
  <span class="spacer"></span>
  <button id="forage-btn" title="Gather herbs and pelts where they grow (by the gate)">Forage</button>
  <button id="craft-btn" title="Make something yourself: smithing at the forge, brewing and cooking at the inn">Craft…</button>
  <button id="sneak-btn" title="Try to move unseen here">Sneak</button>
  <button id="time-btn" class="ghost" hidden>⏸ Time</button>
  <button data-wait="1">Wait 1h</button>
  <button data-wait="4">Wait 4h</button>
  <span id="sim-controls">
    <button id="sim-btn" title="Simulate mode: the village lives on its own while you watch. Move or click the map to take over.">▶ Simulate</button>
    <select id="sim-speed" aria-label="Simulation speed">
      <option value="slow">1h / 3s</option>
      <option value="normal" selected>1h / 1s</option>
      <option value="fast">4h / 0.5s</option>
      <option value="days">1 day / 0.5s</option>
    </select>
    <span id="sim-status" class="pill" hidden></span>
  </span>
  <button id="voice-btn" class="ghost" title="NPC voices (T14): click for voice settings">🔊 Voices</button>
  <button id="newgame" class="ghost">New game</button>
  <span id="llm" class="pill" title="Ollama status">model…</span>
</header>
<div id="banner" hidden></div>
<main>
  <section id="world">
    <div id="map"><p class="loading">Loading the realm…</p></div>
    <div id="roadbar" hidden></div>
    <p class="hint">Move: <kbd>WASD</kbd>/arrows or click a tile · Talk: click a villager or press <kbd>E</kbd> next to them · Speak: hold <kbd>V</kbd> or the 🎙 button</p>
    <div id="feed" aria-live="polite"></div>
  </section>
  <aside id="side">
    <section id="chat" hidden>
      <div class="chat-head">
        <div><strong id="chat-name"></strong> <span id="chat-role"></span></div>
        <button id="chat-close" class="ghost" aria-label="Close conversation">✕</button>
      </div>
      <div id="chat-stats"></div>
      <div id="log"></div>
      <div id="offers"></div>
      <div id="quick"></div>
      <form id="form">
        <select id="mode" aria-label="How you say it">
          <option value="say">Say</option>
          <option value="persuade">Persuade</option>
          <option value="intimidate">Intimidate</option>
          <option value="haggle">Haggle</option>
          <option value="lie">Lie</option>
        </select>
        <input id="line" autocomplete="off" placeholder="Say something…" maxlength="300">
        <button id="mic" type="button" title="Hold to speak (or hold V)" hidden>🎙</button>
        <button id="send">Send</button>
      </form>
      <div id="tools">
        <button data-do="turnin">Hand in quests</button>
        <button data-do="train">Train…</button>
        <button data-do="wares">Wares</button>
        <button data-do="repair" id="repair-btn">Repair…</button>
        <button data-do="look">Look</button>
        <button data-do="introduce">Introduce yourself</button>
        <button data-do="give">Give…</button>
        <button data-do="favour">Ask a favour…</button>
        <button data-do="order" id="order-btn">Order…</button>
        <button data-do="collect" id="collect-btn">Collect order</button>
        <button data-do="repay" id="repay-btn">Repay loan</button>
        <button data-do="retrieve" id="retrieve-btn">Take back what they hid</button>
        <button data-do="steal" class="danger">Steal…</button>
        <button data-do="payfine" id="payfine-btn">Pay fine</button>
        <button data-do="surrender" id="surrender-btn">Give yourself up</button>
        <button data-do="dismiss" id="dismiss-btn">Dismiss</button>
        <button data-do="propose" id="propose-btn">Ask to marry</button>
        <button data-do="flee" class="danger">Flee</button>
        <button data-do="ability" class="danger">Ability…</button>
        <button data-do="subdue" class="danger" title="Fight to knock them out, not to kill">Subdue</button>
        <button data-do="attack" class="danger">Attack</button>
      </div>
    </section>
    <section id="sheet">
      <nav id="tabs">
        <button data-tab="skills" class="on">Character</button>
        <button data-tab="inv" id="tab-inv">Inventory</button>
        <button data-tab="quests">Quests</button>
        <button data-tab="world">World</button>
        <button data-tab="realm" title="The kingdoms, towns and villages beyond here">Realm</button>
      </nav>
      <div id="tab-body"></div>
    </section>
  </aside>
</main>
<dialog id="modal"><div id="modal-body"></div><div class="modal-actions"><button id="modal-close" class="ghost">Close</button></div></dialog>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
