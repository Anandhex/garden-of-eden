name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # T5: every NPC file and template through the schema and the authoring lint.
      - run: npm run check-npcs
      - run: npm run build
      # Unit and server tests only: live tests and the bench scripts need Ollama (and Piper), so they stay out of CI.
      - run: npm test
