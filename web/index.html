<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Millbrook</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <h1>Millbrook</h1>
  <span id="time" class="pill">…</span>
  <span id="today" class="pill" title="Weather, season and what's on in town">…</span>
  <span id="hpbar" class="pill">HP</span>
  <span id="gold" class="pill">0 copper</span>
  <span class="spacer"></span>
  <button data-wait="1">Wait 1h</button>
  <button data-wait="4">Wait 4h</button>
  <button id="newgame" class="ghost">New game</button>
  <span id="llm" class="pill" title="Ollama status">model…</span>
</header>
<div id="banner" hidden></div>
<main>
  <section id="world">
    <canvas id="map" width="832" height="576"></canvas>
    <p class="hint">Move: <kbd>WASD</kbd>/arrows or click a tile · Talk: click a villager or press <kbd>E</kbd> next to them</p>
    <div id="feed" aria-live="polite"></div>
  </section>
  <aside id="side">
    <section id="chat" hidden>
      <div class="chat-head">
        <div><strong id="chat-name"></strong> <span id="chat-role"></span></div>
        <button id="chat-close" class="ghost" aria-label="Close conversation">✕</button>
      </div>
      <div id="chat-stats"></div>
      <div id="log"></div>
      <div id="offers"></div>
      <div id="quick"></div>
      <form id="form">
        <select id="mode" aria-label="How you say it">
          <option value="say">Say</option>
          <option value="persuade">Persuade</option>
          <option value="intimidate">Intimidate</option>
          <option value="haggle">Haggle</option>
          <option value="lie">Lie</option>
        </select>
        <input id="line" autocomplete="off" placeholder="Say something…" maxlength="300">
        <button id="send">Send</button>
      </form>
      <div id="tools">
        <button data-do="turnin">Hand in quests</button>
        <button data-do="train">Train…</button>
        <button data-do="wares">Wares</button>
        <button data-do="repair" id="repair-btn">Repair…</button>
        <button data-do="look">Look</button>
        <button data-do="introduce">Introduce yourself</button>
        <button data-do="give">Give…</button>
        <button data-do="favour">Ask a favour…</button>
        <button data-do="order" id="order-btn">Order…</button>
        <button data-do="collect" id="collect-btn">Collect order</button>
        <button data-do="repay" id="repay-btn">Repay loan</button>
        <button data-do="retrieve" id="retrieve-btn">Take back what they hid</button>
        <button data-do="flee" class="danger">Flee</button>
        <button data-do="attack" class="danger">Attack</button>
      </div>
    </section>
    <section id="sheet">
      <nav id="tabs">
        <button data-tab="skills" class="on">Character</button>
        <button data-tab="inv">Inventory</button>
        <button data-tab="quests">Quests</button>
      </nav>
      <div id="tab-body"></div>
    </section>
  </aside>
</main>
<dialog id="modal"><div id="modal-body"></div><div class="modal-actions"><button id="modal-close" class="ghost">Close</button></div></dialog>
<script type="module" src="/game.js"></script>
</body>
</html>
